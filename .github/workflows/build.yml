name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: myapp

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold fresh Flutter project
        run: |
          cd myapp
          flutter create --org com.smartfiles --project-name smart_file_manager --platforms android fresh
          cp pubspec.yaml fresh/pubspec.yaml
          cp lib/main.dart fresh/lib/main.dart
          cp android/app/src/main/AndroidManifest.xml fresh/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: cd myapp/fresh && flutter pub get

      - name: Build release APK
        run: cd myapp/fresh && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-file-manager-apk
          path: myapp/fresh/build/app/outputs/flutter-apk/app-release.apk
